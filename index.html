<h1>rclone — cliente OAuth de uso pessoal</h1>
<p>Este cliente OAuth existe para uma única finalidade: permitir que o seu dono sincronize o próprio Google Drive com o próprio computador, usando o <a href="https://rclone.org/">rclone</a>.</p>
<p>Não é um produto, não é oferecido a terceiros e não tem outros usuários.</p>
